services:
  - type: web
    name: fyro-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_EXTERNAL_SERVICES
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Phase 4 AI agents — set the real value in Render's dashboard
      # (Environment tab), never here. Absent = agents run in mock mode;
      # unrelated to MOCK_EXTERNAL_SERVICES, see agents/client.ts.
      - key: ANTHROPIC_API_KEY
        sync: false

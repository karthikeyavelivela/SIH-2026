services:
  - type: web
    name: fyro-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_EXTERNAL_SERVICES
        value: "true"
      # Per-integration switches; each falls back to MOCK_EXTERNAL_SERVICES
      # when unset. For the live demo: payments in Razorpay TEST mode
      # (MOCK_PAYMENTS=false + test keys), real uploads, mocked OTP until an
      # SMS gateway is live. With MOCK_PAYMENTS=false the server refuses to
      # boot unless all three RAZORPAY_* values below are set.
      - key: MOCK_PAYMENTS
        sync: false
      - key: MOCK_UPLOADS
        sync: false
      - key: MOCK_OTP
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AUTO_CONFIRM_HOURS
        value: "24"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Phase 4 AI agents — set the real value in Render's dashboard
      # (Environment tab), never here. Absent = agents run in mock mode;
      # unrelated to MOCK_EXTERNAL_SERVICES, see agents/client.ts.
      - key: ANTHROPIC_API_KEY
        sync: false

services:
  - type: web
    name: fyro-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_EXTERNAL_SERVICES
        value: "true"
      # Per-integration switches; each falls back to MOCK_EXTERNAL_SERVICES
      # when unset. For the live demo: payments in Razorpay TEST mode
      # (MOCK_PAYMENTS=false + test keys), real uploads, mocked OTP until an
      # SMS gateway is live. With MOCK_PAYMENTS=false the server refuses to
      # boot unless all three RAZORPAY_* values below are set.
      - key: MOCK_PAYMENTS
        sync: false
      - key: MOCK_UPLOADS
        sync: false
      - key: MOCK_OTP
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AUTO_CONFIRM_HOURS
        value: "24"
      # Render sits behind Cloudflare: key per-IP rate limits on CF-Connecting-IP.
      - key: TRUST_CLOUDFLARE
        value: "true"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Phase 4 AI agents — set the real value in Render's dashboard
      # (Environment tab), never here. Absent = agents run in mock mode;
      # unrelated to MOCK_EXTERNAL_SERVICES, see agents/client.ts.
      - key: ANTHROPIC_API_KEY
        sync: false
      # P2.1 — the ML service below. Both unset = forecasts, allocation and
      # price checks use the rule-based path, labelled source "rules".
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        sync: false
      # P3.1 — set to run on more than one instance: shared rate limits, offer
      # state and Socket.io rooms, and recurring jobs that run once (BullMQ).
      # Unset = everything stays in memory on this single instance.
      - key: REDIS_URL
        sync: false

  # P2.1 — fyro-ml: demand forecast, crew allocation, price anomaly.
  # A second free-plan service; it sleeps when idle, so the first call after
  # a quiet spell can be slow. The API times out at 3 s and falls back to rules.
  - type: web
    name: fyro-ml
    runtime: python
    plan: free
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Must equal the API's ML_SERVICE_TOKEN (at least 16 characters).
      - key: ML_SERVICE_TOKEN
        sync: false
